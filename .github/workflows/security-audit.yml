name: security-audit

# Blocks CI on dependency vulnerabilities so a vulnerable dependency
# cannot land, or sit, unnoticed. The weekly cron catches advisories
# disclosed against dependencies already in use, where no commit is
# needed for the repo to become vulnerable.
#
# Hand-maintained. The other workflows here are generated by
# repo-hardening tooling that detects dependency manifests only at the
# repo root; this repo keeps all three in subdirectories, so this gate
# is written by hand. Generated workflows carry an "Auto-managed by"
# marker on line 2; this file omits it so the tooling leaves it alone.
#
# No untrusted input is interpolated into any run: step.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    # govulncheck fails the build only on vulnerabilities reachable from
    # each module's own code, per its call-graph analysis.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: 'stable'
          cache-dependency-path: |
            whatsapp-bridge/go.sum
            prospect-api/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck (whatsapp-bridge)
        working-directory: whatsapp-bridge
        run: govulncheck ./...
      - name: govulncheck (prospect-api)
        working-directory: prospect-api
        run: govulncheck ./...

  pip-audit:
    # uv.lock is gitignored here, so the audit targets a fresh resolve of
    # pyproject.toml, the dependency tree an install actually produces.
    # --all-extras audits the optional extras too (e.g. the openai extra),
    # i.e. the full shippable surface; --no-dev leaves out dev-only tools
    # (pytest, ruff) so the gate stays signal, not noise.
    # pip-audit reads the OSV / PyPI advisory database. A genuinely
    # unfixable advisory can be waived with
    # `pip-audit --ignore-vuln <GHSA-id>` plus a justifying comment,
    # never by deleting this gate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: pip-audit (whatsapp-mcp-server)
        working-directory: whatsapp-mcp-server
        run: uv run --no-dev --all-extras --with pip-audit pip-audit
