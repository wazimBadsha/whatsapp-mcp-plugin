name: tests
# Broader test gate. Runs on every PR + push.
#
# Coverage:
#   - Go: every test in whatsapp-bridge (scrubber + normalize + aliases + future).
#     Broader than scrubber-eval.yml, which only triggers on scrubber file
#     changes. The aliases + normalize tests catch regressions on the LID/phone
#     JID merge code and accent-insensitive search.
#   - Python: every test under whatsapp-mcp-server/tests (scrub parity vs Go,
#     CRM lookup, phone normalizer). Pattern-count parity test fails CI if the
#     Python scrubber drifts from the Go one — both run in production and
#     drift is a security defect.
#
# Why not extend build.yml: build.yml is auto-managed by gh-harden-repos.sh
# and any hand-edit would be overwritten on next sync. This lives separately.
#
# Security note: this workflow does not consume any untrusted user-supplied
# fields (no issue/PR titles, branch names, commit messages, comment bodies).
# It runs go test + pytest against checked-in code only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests (${{ matrix.os }})
    # Cross-platform gate (Mycelium cross-platform rule, MYC-3033): the bridge
    # must compile with CGO and pass its suite on Windows, macOS, and Linux.
    # The windows leg also runs keychain_windows_test.go against the real
    # Credential Manager — the proof the Windows key store works, not just
    # compiles. go-sqlcipher needs a C compiler: preinstalled clang/gcc on
    # macOS/Linux; MSYS2 UCRT64 gcc on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: 'stable'
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Put UCRT64 gcc on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
      - name: gofmt check
        # 21 of 91 tracked .go files had drifted because nothing checked.
        # Linux only: the check is platform-independent and running it on the
        # Windows leg would fight core.autocrlf on contributors' clones.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l whatsapp-bridge prospect-api)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean."

      - name: Run go test
        working-directory: whatsapp-bridge
        shell: bash
        run: go test -v -count=1 ./...

  python:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The full range pyproject declares (>=3.11,<3.14). Testing only the
        # floor is what let the .python-version pin hide for months: it forced
        # every user onto 3.11, so 3.12 and 3.13 were shipped-but-never-run.
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime + dev deps
        working-directory: whatsapp-mcp-server
        # bash on every OS: the windows runner defaults to pwsh, which
        # rejects the \ line continuations below.
        shell: bash
        # uv sync is blocked by the parent-dir readme/license refs in
        # pyproject.toml (setuptools refuses to read outside the package root).
        # Install dependencies directly; tests don't need the package built.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'fastmcp>=3.2.4' \
            'httpx>=0.27.0' \
            'python-frontmatter>=1.1.0' \
            'unidecode>=1.3.8' \
            'pytest>=8.0' \
            'pytest-asyncio>=0.23'
      - name: Run pytest
        working-directory: whatsapp-mcp-server
        shell: bash
        run: pytest tests/
