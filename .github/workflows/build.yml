name: build
# Auto-managed by ~/.local/bin/gh-harden-repos.sh. Do not hand-edit.
# Minimal Go build gate. Walks every go.mod in the tree and runs
# `go build ./...` to catch compile failures (untracked files, missing
# imports, broken refactors) before anyone else pulls. On failure,
# GitHub emails the repo owner via their primary notification email.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  # A superseded push to the same PR cancels the in-flight run instead of
  # billing it to completion. Scoped to pull_request ONLY: push / schedule runs
  # are never cancelled (and if a merge queue is ever wired here, cancelling a
  # queued group would deadlock it). Added by MYC-3180; moved into the
  # generator by MYC-3412 so regeneration stops silently reverting it.
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
      - name: Build all Go modules
        run: |
          set -e
          shopt -s globstar nullglob 2>/dev/null || true
          found=0
          while IFS= read -r modfile; do
            found=$((found + 1))
            moddir=$(dirname "$modfile")
            echo "::group::Building $moddir"
            (cd "$moddir" && go build ./...)
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path './vendor/*' -not -path '*/vendor/*' -not -path '*/.git/*')
          if [ "$found" -eq 0 ]; then
            echo "No go.mod found — failing loud (workflow shouldn't have been installed)"
            exit 1
          fi
          echo "Built $found module(s) cleanly."